<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 80" fill="none">
  <defs>
    <linearGradient id="brandGradH" x1="15%" y1="5%" x2="85%" y2="95%">
      <stop offset="0%" stop-color="#5b6ef5"/>
      <stop offset="100%" stop-color="#7c4dff"/>
    </linearGradient>
    <radialGradient id="ballSheenH" cx="38%" cy="32%" r="65%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#5b6ef5"/>
      <stop offset="100%" stop-color="#7c4dff"/>
    </linearGradient>
  </defs>

  <!-- Mark — scaled -->
  <g transform="translate(0, 0) scale(0.4)">
    <circle cx="100" cy="100" r="90" stroke="url(#brandGradH)" stroke-width="2.5" fill="none" opacity="0.35" stroke-dasharray="42 12" stroke-dashoffset="10"/>
    <circle cx="100" cy="100" r="72" stroke="url(#brandGradH)" stroke-width="3.5" fill="none" opacity="0.5"/>
    <circle cx="100" cy="100" r="56" stroke="url(#brandGradH)" stroke-width="5" fill="none" opacity="0.75"/>

    <circle cx="100" cy="100" r="38" fill="url(#brandGradH)"/>
    <circle cx="100" cy="100" r="38" fill="url(#ballSheenH)"/>

    <path d="M 88 82 L 88 118" stroke="#ffffff" stroke-width="8" stroke-linecap="round"/>
    <path d="M 88 82 L 120 82" stroke="#ffffff" stroke-width="8" stroke-linecap="round"/>
    <path d="M 88 100 L 114 100" stroke="#ffffff" stroke-width="7" stroke-linecap="round" opacity="0.88"/>

    <circle cx="100" cy="10" r="3.5" fill="url(#brandGradH)" opacity="0.6"/>
    <circle cx="190" cy="100" r="3.5" fill="url(#brandGradH)" opacity="0.6"/>
