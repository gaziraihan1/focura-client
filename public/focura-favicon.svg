<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="fg" x1="15%" y1="5%" x2="85%" y2="95%">
      <stop offset="0%" stop-color="#5b6ef5"/>
      <stop offset="100%" stop-color="#7c4dff"/>
    </linearGradient>
    <radialGradient id="sheen" cx="38%" cy="32%" r="65%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Rings -->
  <circle cx="32" cy="32" r="29" stroke="url(#fg)" stroke-width="1.5" fill="none" opacity="0.4" stroke-dasharray="14 4"/>
  <circle cx="32" cy="32" r="23" stroke="url(#fg)" stroke-width="2" fill="none" opacity="0.55"/>

  <!-- Ball -->
  <circle cx="32" cy="32" r="17" fill="url(#fg)"/>
  <circle cx="32" cy="32" r="17" fill="url(#sheen)"/>

  <!-- F — bold, fills ball -->
  <path d="M 25 23 L 25 41" stroke="#ffffff" stroke-width="5" stroke-linecap="round"/>
  <path d="M 25 23 L 39 23" stroke="#ffffff" stroke-width="5" stroke-linecap="round"/>
  <path d="M 25 32 L 36 32" stroke="#ffffff" stroke-width="4.5" stroke-linecap="round" opacity="0.9"/>
</svg>
