<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none">
  <defs>
    <!-- Richer, more saturated gradient -->
    <linearGradient id="brandGrad" x1="15%" y1="5%" x2="85%" y2="95%">
      <stop offset="0%" stop-color="#5b6ef5"/>
      <stop offset="100%" stop-color="#7c4dff"/>
    </linearGradient>

    <radialGradient id="ballSheen" cx="38%" cy="32%" r="65%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>

    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="2"/>
    </filter>
  </defs>

  <!-- ═══ OUTER RING — crisp, visible ═══════════════════════════════════ -->
  <circle cx="100" cy="100" r="90" stroke="url(#brandGrad)" stroke-width="2.5" fill="none" opacity="0.35" stroke-dasharray="42 12" stroke-dashoffset="10"/>

  <!-- ═══ MIDDLE RING ═════════════════════════════════════════════════ -->
  <circle cx="100" cy="100" r="72" stroke="url(#brandGrad)" stroke-width="3.5" fill="none" opacity="0.5"/>

  <!-- ═══ INNER RING — boldest ═════════════════════════════════════════ -->
  <circle cx="100" cy="100" r="56" stroke="url(#brandGrad)" stroke-width="5" fill="none" opacity="0.75"/>

  <!-- ═══ CORE BALL — sharp, rich ══════════════════════════════════════ -->
  <circle cx="100" cy="100" r="38" fill="url(#brandGrad)"/>
  <circle cx="100" cy="100" r="38" fill="url(#ballSheen)"/>

  <!-- ═══ "F" — pure white, bold, fills the ball ══════════════════════ -->
  <path d="M 88 82 L 88 118" stroke="#ffffff" stroke-width="8" stroke-linecap="round"/>
  <path d="M 88 82 L 120 82" stroke="#ffffff" stroke-width="8" stroke-linecap="round"/>
  <path d="M 88 100 L 114 100" stroke="#ffffff" stroke-width="7" stroke-linecap="round" opacity="0.88"/>

  <!-- ═══ CARDINAL DOTS — on the rings ═════════════════════════════════ -->
  <circle cx="100" cy="10" r="3.5" fill="url(#brandGrad)" opacity="0.6"/>
  <circle cx="190" cy="100" r="3.5" fill="url(#brandGrad)" opacity="0.6"/>
  <circle cx="100" cy="190" r="3.5" fill="url(#brandGrad)" opacity="0.6"/>
  <circle cx="10" cy="100" r="3.5" fill="url(#brandGrad)" opacity="0.6"/>
</svg>
